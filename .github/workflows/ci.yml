name: CI

on:
  push:
  pull_request:

jobs:
  windows-build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Install cppcheck
        shell: powershell
        run: |
          choco install cppcheck -y

      - name: Static analysis (cppcheck)
        shell: powershell
        run: cppcheck --version

      - name: Run cppcheck
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools/lint/run_cppcheck.ps1

      - name: Configure (CMake)
        shell: powershell
        run: cmake -S . -B build

      - name: Build (Debug)
        shell: powershell
        run: cmake --build build --config Debug

      - name: Run unit tests (CTest - Debug)
        shell: powershell
        run: ctest --test-dir build -C Debug --output-on-failure

      # -------------------- COVERAGE (Debug) --------------------
      - name: Install OpenCppCoverage
        shell: powershell
        run: |
          choco install opencppcoverage -y

      - name: Locate OpenCppCoverage
        shell: powershell
        run: |
          $exe = "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe"
          if (!(Test-Path $exe)) { throw "OpenCppCoverage.exe not found at $exe" }
          & $exe --version

      - name: Generate coverage (Debug)
        shell: powershell
        run: |
          $exe = "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe"
          $src = "${{ github.workspace }}\src"
          $out = "${{ github.workspace }}\reports\coverage"
          $bld = "${{ github.workspace }}\build"

          New-Item -ItemType Directory -Force -Path $out | Out-Null

          & $exe `
            --sources $src `
            --export_type "html:$out" `
            --working_dir $bld `
            -- ctest --test-dir $bld -C Debug --output-on-failure

      - name: Upload coverage report (HTML)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: reports/coverage
      # ----------------------------------------------------------

      - name: Build (Release)
        shell: powershell
        run: cmake --build build --config Release

      - name: Run unit tests (CTest - Release)
        shell: powershell
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Traceability check
        shell: powershell
        run: python tools/traceability/trace_check.py

      - name: Upload traceability report
        uses: actions/upload-artifact@v4
        with:
          name: traceability-report
          path: reports/traceability_report.md
