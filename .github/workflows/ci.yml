name: CI

on:
  push:
  pull_request:

jobs:
  windows-build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      # ---------- Static analysis ----------
      - name: Install cppcheck
        run: |
          choco install cppcheck -y
          refreshenv

      - name: Run cppcheck
        run: powershell -ExecutionPolicy Bypass -File tools/lint/run_cppcheck.ps1

      # ---------- Configure / Build Debug ----------
      - name: Configure (CMake)
        run: cmake -S . -B build

      - name: Build (Debug)
        run: cmake --build build --config Debug

      - name: Run unit tests (CTest - Debug)
        run: ctest --test-dir build -C Debug --output-on-failure

      # ---------- Coverage (Debug) ----------
      - name: Install OpenCppCoverage
        run: |
          choco install opencppcoverage -y
          refreshenv

      - name: Check OpenCppCoverage
        run: OpenCppCoverage --version

      - name: Generate coverage (Debug)
        run: |
          OpenCppCoverage ^
            --sources "${{ github.workspace }}\src" ^
            --export_type "html:${{ github.workspace }}\reports\coverage" ^
            --working_dir "${{ github.workspace }}\build" ^
            -- ctest --test-dir "${{ github.workspace }}\build" -C Debug --output-on-failure

      - name: Upload coverage report (HTML)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: reports/coverage

      # ---------- Build / Test Release ----------
      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Run unit tests (CTest - Release)
        run: ctest --test-dir build -C Release --output-on-failure

      # ---------- Traceability ----------
      - name: Traceability check
        run: python tools/traceability/trace_check.py

      - name: Upload traceability report
        uses: actions/upload-artifact@v4
        with:
          name: traceability-report
          path: reports/traceability_report.md
